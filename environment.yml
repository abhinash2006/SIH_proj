name: drone_vggt_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pytorch=2.6.0
  - torchvision=0.21.0
  - pytorch-cuda=12.4
  - numpy>=1.26.0,<2.0.0
  - scipy>=1.11.0
  - matplotlib>=3.8.0
  - pyyaml>=6.0
  - pip:
    - opencv-python>=4.8.0
    - open3d>=0.18.0
    - trimesh>=4.0.0
    - huggingface_hub>=0.20.0
    - safetensors>=0.4.0
    - einops>=0.7.0
    - gradio>=4.0.0
    - pytest>=7.4.0
    - -e ./vggt_repo
