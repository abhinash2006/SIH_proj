# Disaster Inspection & Hazard Assessment Configuration
disaster_inspection:
  enabled: true
  person_detection:
    enabled: true
    confidence_threshold: 0.25
    model_size: "n" # YOLOv8n ultra-lightweight
  damage_detection:
    enabled: true
    texture_threshold: 800.0
    depth_discontinuity_threshold: 0.15
  hazard_detection:
    flood:
      enabled: true
      water_coverage_threshold: 0.08
    fire:
      enabled: true
      heat_hue_threshold: 0.015
    debris:
      enabled: true
      edge_density_threshold: 45.0
  geo_projection:
    enabled: true
    use_gps_if_available: true
  incident_database:
    sqlite_path: "outputs/incidents.db"
    json_path: "outputs/incidents.json"
  class_thresholds:
    person: 0.08
    vehicle: 0.15
    building: 0.15
    boat: 0.15
  context_validation:
    enabled: true
    vehicle_min_area: 250
    vehicle_max_area: 12000
    vehicle_aspect_ratio_range: [1.1, 4.0]
    building_min_area: 3000
    building_aspect_ratio_range: [0.4, 2.5]
    boat_min_water_overlap: 0.15
    temporal_min_vote_ratio: 0.60
