# Model Configurations for Single-Pass UAV 3D Reconstruction System
# Supports modular, replaceable components and environment variable overrides

models:
  # ==============================================================================
  # VGGT: Visual Geometry Grounded Transformer
  # NOTE: To switch to fine-tuned model later, simply change:
  # backend: "finetuned"
  # checkpoint: "models/vggt/finetuned/best_checkpoint.pth"
  # Or set environment variable: VGGT_CHECKPOINT
  # ==============================================================================
  vggt:
    enabled: true
    backend: "pretrained" # Options: "pretrained", "finetuned", "mock"
    model_name: "facebook/VGGT-1B"
    checkpoint: "models/VGGT-1B/model.pt"
    device: "auto" # "cuda", "cpu", or "auto"
    use_mixed_precision: true
    resolution: 392 # 392 for <=6GB VRAM GPUs (e.g. RTX 3050 4GB), 518 for >6GB
    chunk_size: 24 # Safe chunk processing budget
    enable_camera: true
    enable_point: true
    enable_depth: true
    enable_track: false

  # ==============================================================================
  # YOLO: 2D Dynamic Object Detection
  # ==============================================================================
  yolo:
    enabled: true
    checkpoint: "yolo11n.pt" # Fallback: "yolov8n.pt"
    device: "auto"
    confidence_threshold: 0.35
    iou_threshold: 0.45
    image_size: 640
    # Configurable dynamic classes to detect & exclude from 3D reconstruction
    # Static classes (buildings, roads, terrain, vegetation, poles) are preserved
    dynamic_classes:
      - "person"
      - "car"
      - "truck"
      - "bus"
      - "motorcycle"
      - "bicycle"
      - "animal"
      - "dog"
      - "cat"
      - "horse"
      - "boat"

  # ==============================================================================
  # SAM 2: Segment Anything Model 2 (Precise Dynamic Object Masking)
  # ==============================================================================
  sam2:
    enabled: true
    model_cfg: "configs/sam2.1/sam2.1_hiera_s.yaml"
    checkpoint: "models/sam2/sam2.1_hiera_small.pt"
    device: "auto"
    use_fallback_mask_on_missing: true # Uses bbox polygon mask if SAM2 is uninstalled

  # ==============================================================================
  # Depth Anything V2: Monocular Depth Comparison & Fallback
  # ==============================================================================
  depth_anything:
    enabled: true
    encoder: "vits" # "vits", "vitb", "vitl"
    checkpoint: "models/depth_anything_v2/depth_anything_v2_vits.pth"
    device: "auto"
    max_depth: 100.0
    relative_scale: true
