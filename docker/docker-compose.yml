version: '3.8'

services:
  aeroscan3d:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aeroscan_3d_pipeline
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ../data:/workspace/data
      - ../output:/workspace/output
      - ../models:/workspace/models
      - ../configs:/workspace/configs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VGGT_CHECKPOINT=/workspace/models/VGGT-1B/model.pt
    restart: unless-stopped
